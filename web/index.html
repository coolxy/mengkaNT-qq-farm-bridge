<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>QQ农场助手桥接</title>
<script>
  // 主题：优先本地记忆，其次跟随系统（避免首屏闪烁）
  (function () {
    try {
      var t = localStorage.getItem('qf-theme')
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
      }
      // URL 参数 ?theme=light|dark 最高优先（方便外链/卡片内直接指定）
      var p = new URLSearchParams(location.search).get('theme')
      if (p === 'light' || p === 'dark') { t = p; localStorage.setItem('qf-theme', p) }
      document.documentElement.setAttribute('data-theme', t)
    } catch (e) { document.documentElement.setAttribute('data-theme', 'dark') }
  })()
</script>
<style>
:root{
  --bg:#0d1117;--card:#161b22;--line:#252d38;--fg:#e6edf3;--dim:#8b949e;
  --ok:#3fb950;--bad:#f85149;--warn:#d29922;--acc:#2f81f7;
  --input-bg:#0b0f14;--btn-bg:#21262d;--btn-hover:#2b323b;--farm-bg:#0f141b;--code-bg:#0b0f14;
  --ok-line:#1f4d2a;--bad-line:#5a2320;--warn-line:#4d3a12;--hover-line:#8b949e;
}
:root[data-theme=light]{
  --bg:#f4f6fa;--card:#ffffff;--line:#dde3ec;--fg:#1c2430;--dim:#647084;
  --ok:#1a7f37;--bad:#cf222e;--warn:#9a6700;--acc:#0969da;
  --input-bg:#ffffff;--btn-bg:#f1f4f9;--btn-hover:#e5eaf2;--farm-bg:#fafbfd;--code-bg:#f6f8fa;
  --ok-line:#a7d4b2;--bad-line:#f0b0ab;--warn-line:#e6cf9a;--hover-line:#b6bfcc;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 -apple-system,"Segoe UI",system-ui,"Microsoft YaHei",sans-serif;transition:background .18s,color .18s}
.wrap{max-width:1060px;margin:0 auto;padding:18px}
.head{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px}
.head h1{font-size:17px;margin:0;font-weight:600}
.ver{color:var(--dim);font-size:12px}
.state{margin-left:auto;font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--line)}
.state.ok{color:var(--ok);border-color:var(--ok-line)}.state.bad{color:var(--bad);border-color:var(--bad-line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.card h2{font-size:13px;margin:0 0 10px;color:var(--dim);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.cardhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.cardhead h2{margin:0}
.cardhead .msg{margin-left:auto}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--dim)}
input,select{background:var(--input-bg);border:1px solid var(--line);color:var(--fg);border-radius:7px;padding:7px 9px;font:inherit;font-size:13px;min-width:0}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--acc);cursor:pointer}
input[type=checkbox]:disabled{cursor:progress;opacity:.5}
button{background:var(--btn-bg);border:1px solid var(--line);color:var(--fg);border-radius:7px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer;transition:background .15s,border-color .15s}
button:hover{background:var(--btn-hover)}button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button.primary:hover{filter:brightness(1.08)}button.danger{color:var(--bad);border-color:var(--bad-line)}
button.mini{padding:3px 10px;font-size:12px;border-radius:6px}
button.mini:disabled{color:var(--dim);cursor:not-allowed;opacity:.6}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;padding:0;border-radius:9px}
.iconbtn svg{width:18px;height:18px;display:block}
:root[data-theme=dark] .ico-moon{display:none}
:root[data-theme=light] .ico-sun{display:none}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--dim);font-weight:500;font-size:12px}
tbody tr:hover{background:var(--farm-bg)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.pill{padding:1px 8px;border-radius:99px;font-size:11px;border:1px solid var(--line);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:var(--ok-line)}.pill.bad{color:var(--bad);border-color:var(--bad-line)}
.pill.warn{color:var(--warn);border-color:var(--warn-line)}.pill.dim{color:var(--dim)}
.msg{font-size:12px}.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:220px;overflow:auto;font-size:12px;color:var(--dim);margin:0}
.farm{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;background:var(--farm-bg)}
.farm.active{border-color:var(--acc)}
.spacer{flex:1}
.sw{display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.sw span{font-size:12px;color:var(--dim)}
</style></head>
<body><div class="wrap">
  <div class="head">
    <h1>QQ农场助手桥接</h1><span class="ver" id="ver">v-</span><a id="repo" href="https://github.com/coolxy/mengkaNT-qq-farm-bridge" target="_blank" rel="noopener" style="color:var(--acc);font-size:12px">GitHub 仓库</a><span class="ver">· 插件管理页（本页）</span>
    <div class="spacer"></div>
    <button class="iconbtn" id="theme" type="button" title="切换白天/夜间" aria-label="切换白天/夜间">
      <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="4.2" fill="currentColor" stroke="none"/>
        <path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6"/>
      </svg>
      <svg class="ico-moon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.7 8.7 0 1 0 11.1 11.1z"/>
      </svg>
    </button>
    <span class="state" id="conn">连接中…</span>
  </div>

  <div class="card">
    <h2>服务器管理（推送目标 = 选中的那台；「访问 Code」版农场把 Code 填到密码栏，账号留空）</h2>
    <div id="farms"></div>
    <div class="row" style="margin-top:10px">
      <button id="add">+ 新增服务器</button>
      <button class="primary" id="save">保存设置</button>
      <button id="test">测试连接</button>
      <span class="msg" id="saveMsg"></span>
    </div>
  </div>

  <div class="card">
    <h2>推送设置</h2>
    <div class="row">
      <label class="f">间隔（分钟）<input id="interval" type="number" min="1" max="240" style="width:90px"/></label>
      <label class="f">临期提前刷新（分钟，0=关）<input id="refresh" type="number" min="0" max="120" style="width:90px"/></label>
      <label class="f">仅推这些 QQ（逗号分隔，空=全部）<input id="filter" style="width:240px" placeholder="100000，888888"/></label>
    </div>
    <div class="row">
      <label class="f"><span><input type="checkbox" id="skipOnline"/> 已在线跳过</span></label>
      <label class="f"><span><input type="checkbox" id="startAfter"/> 更新后调用 /start</span></label>
      <label class="f"><span><input type="checkbox" id="useEvents"/> bot_online 事件即时推送</span></label>
      <label class="f"><span><input type="checkbox" id="pushAndroid"/> 推送 Android</span></label>
      <label class="f"><span><input type="checkbox" id="pushLinux"/> 推送 Linux/PC（会 skipped）</span></label>
    </div>
    <div class="row">
      <button class="primary" id="saveOpts">保存设置</button>
      <span class="msg" id="optMsg"></span>
      <div class="spacer"></div>
      <button class="primary" id="push">⚡ 立即推送</button>
    </div>
  </div>

  <div class="card">
    <div class="cardhead">
      <h2>QQ 账号状态 · 最近一次推送</h2>
      <span class="msg" id="botMsg"></span>
    </div>
    <div class="row" id="lastMeta" style="margin:-2px 0 8px"></div>
    <div id="qqtable"><span class="msg">读取中…</span></div>
  </div>

  <div class="card">
    <h2>运行日志</h2>
    <pre id="logs"></pre>
  </div>
</div>
<script>
var BASE = location.pathname.replace(/\/+$/, '')
function apiUrl(p) { return BASE && p.charAt(0) === '/' ? BASE + p : p }
function $(id) { return document.getElementById(id) }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c] }) }
function api(path, opts) {
  return fetch(apiUrl(path), Object.assign({ credentials: 'same-origin', headers: { 'Content-Type': 'application/json' } }, opts || {}))
    .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status)) ; return j }) })
}
function setConn(t, cls) { var e = $('conn'); e.textContent = t; e.className = 'state ' + (cls || '') }
function farmStatePill(s) {
  var map = { online: ['ok', '在线'], transient: ['warn', '登录中'], expiring: ['warn', '临期'], offline: ['bad', '离线'], missing: ['dim', '无记录'], level: ['dim', '等级不足'], unknown: ['dim', '未知'] }
  var m = map[s] || ['dim', s || '-']
  return '<span class="pill ' + m[0] + '">' + esc(m[1]) + '</span>'
}
function actionPill(a) {
  var map = { update: ['ok', '已更新'], create: ['ok', '已新建'], skip: ['dim', '跳过'], fail: ['bad', '失败'] }
  var m = map[a] || ['dim', a || '-']
  return '<span class="pill ' + m[0] + '">' + esc(m[1]) + '</span>'
}

var FARMS = [], ACTIVE = 0, OPT = {}, BOTMAP = {}
var DIRTY = false, PUSHING = {}
// 正在编辑（焦点在输入框）或改过未保存时，暂停对表单区域的重绘，避免输入被轮询打断
function editBlocked() {
  var ae = document.activeElement
  if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) {
    if (ae.closest && ae.closest('#farms')) return true
    if (['interval', 'refresh', 'filter'].indexOf(ae.id) >= 0) return true
  }
  return DIRTY
}
function qqEnabled(id) { return BOTMAP[id] !== false }
function renderFarms() {
  var h = ''
  for (var i = 0; i < FARMS.length; i++) {
    var f = FARMS[i]
    h += '<div class="farm' + (i === ACTIVE ? ' active' : '') + '">'
      + '<div class="row"><label class="f"><span><input type="radio" name="act" value="' + i + '"' + (i === ACTIVE ? ' checked' : '') + '/> 推送目标</span></label>'
      + '<label class="f">地址<input data-i="' + i + '" data-k="baseUrl" value="' + esc(f.baseUrl) + '" style="width:320px" placeholder="http://ip:3007"/></label>'
      + '<label class="f">账号<input data-i="' + i + '" data-k="username" value="' + esc(f.username) + '" style="width:120px" placeholder="admin"/></label>'
      + '<label class="f">密码 / 访问 Code<input data-i="' + i + '" data-k="password" type="password" style="width:160px" placeholder="' + (f.passwordSet ? '已设置，留空不改' : '未设置') + '"/></label>'
      + '<div class="spacer"></div><button class="danger" data-del="' + i + '">删除</button></div></div>'
  }
  $('farms').innerHTML = h || '<span class="msg">还没有服务器，点下面新增</span>'
  Array.prototype.forEach.call(document.querySelectorAll('[data-k]'), function (el) {
    el.oninput = function () { DIRTY = true; FARMS[+el.dataset.i][el.dataset.k] = el.value }
  })
  Array.prototype.forEach.call(document.querySelectorAll('input[name=act]'), function (el) {
    el.onchange = function () { ACTIVE = +el.value; renderFarms() }
  })
  Array.prototype.forEach.call(document.querySelectorAll('[data-del]'), function (el) {
    el.onclick = function () { FARMS.splice(+el.dataset.del, 1); if (ACTIVE >= FARMS.length) ACTIVE = Math.max(0, FARMS.length - 1); renderFarms() }
  })
}

function paintOptions(o) {
  OPT = o
  $('interval').value = o.intervalMinutes
  $('refresh').value = o.refreshBeforeExpireMin
  $('filter').value = o.qqFilter
  $('skipOnline').checked = o.skipWhenOnline
  $('startAfter').checked = o.startAfterUpdate
  $('useEvents').checked = o.useEvents
  $('pushAndroid').checked = o.pushAndroid
  $('pushLinux').checked = o.pushLinux
}

// ---- 合并表：账号状态 + 最近一次推送 ----
// 行顺序固定为 QQ 号升序（长度优先再字典序 = 数值升序）；刷新时只改单元格内容，不重建行，避免顺序跳动与闪烁
var TH = ['QQ', '自动推送', '昵称', '平台', '等级', '农场状态', 'code 过期', '最近动作', '说明', '操作']
var KEYS = ['qq', 'on', 'nick', 'plat', 'level', 'state', 'exp', 'act', 'note', 'op']
var TH_TIP = {
  1: '勾选=参与定时/事件自动推送；不勾选=跳过自动推送，但仍可用行尾「推送」按钮手动推',
  9: '立即推送该号 code，强制取码，不受自动推送开关限制'
}
var BOTS = [], LAST = null, QQ_ROWS = {}, QQ_SEQ = null

function cmpId(a, b) { return (a.length - b.length) || (a < b ? -1 : a > b ? 1 : 0) }
function timeShort(t) { try { return new Date(t).toLocaleTimeString('zh-CN', { hour12: false }) } catch (e) { return '-' } }

function aggregateQQ(bots, last) {
  var map = {}, out = []
  ;(bots || []).forEach(function (b) {
    if (!b || b.selfId == null) return
    var id = String(b.selfId)
    if (!map[id]) { map[id] = { id: id, online: true }; out.push(map[id]) }
    map[id].bot = b
  })
  ;((last && last.items) || []).forEach(function (i) {
    if (!i || i.selfId == null) return
    var id = String(i.selfId)
    if (!map[id]) { map[id] = { id: id, online: false }; out.push(map[id]) }
    map[id].last = i
  })
  return out.sort(function (a, b) { return cmpId(a.id, b.id) })
}

function qqCells(d) {
  var b = d.bot || {}, L = d.last || {}, id = d.id
  var on = BOTMAP[id] !== false, busy = !!PUSHING[id]
  var level = b.level || L.level || ''
  var note = b.farmDetail || L.detail || ''
  var err = L.error && L.error !== note ? L.error : ''
  var noteHtml = esc(note) || ''
  if (err) noteHtml += (noteHtml ? ' ' : '') + '<span class="msg bad">' + esc(err) + '</span>'
  return {
    qq: '<span class="mono">' + esc(id) + '</span>' + (d.online ? '' : ' <span class="pill dim">不在线</span>'),
    on: '<label class="sw"><input type="checkbox" data-qq="' + esc(id) + '"' + (on ? ' checked' : '') + '/><span>' + (on ? '自动' : '仅手动') + '</span></label>',
    nick: esc(b.nickname || L.nickname || '-'),
    plat: esc(b.platform || '-'),
    level: String(level || '-'),
    state: farmStatePill(b.farmState || L.farmState),
    exp: '<span class="mono">' + (b.expiresAt ? timeShort(b.expiresAt) : '-') + '</span>',
    act: L.action ? actionPill(L.action) : '<span class="pill dim">-</span>',
    note: noteHtml || '-',
    op: '<button class="mini" data-push1="' + esc(id) + '"' + (busy ? ' disabled' : '')
      + ' title="立即推送该 QQ 的 code（强制取码，忽略在线跳过；不受自动推送开关限制）">'
      + (busy ? '推送中…' : '推送') + '</button>'
  }
}

function paintLastMeta(last) {
  var el = $('lastMeta'), h
  if (!last) h = '<span class="msg">还没有推送记录</span>'
  else {
    h = '<span class="msg">最近一次：' + esc(last.reason || '-') + ' · ' + new Date(last.at).toLocaleString('zh-CN', { hour12: false })
      + (last.farmUrl ? ' · ' + esc(last.farmUrl) : '') + (last.empty ? ' · 无匹配号' : '') + '</span>'
    if (last.error) h += ' <span class="msg bad">' + esc(last.error) + '</span>'
  }
  if (el.__h !== h) { el.innerHTML = h; el.__h = h }
}

function paintQQ(bots, last) {
  BOTS = bots || []; LAST = last || null
  BOTMAP = {}
  BOTS.forEach(function (b) { if (b && b.selfId != null) BOTMAP[String(b.selfId)] = b.pushEnabled !== false })
  paintLastMeta(LAST)
  var list = aggregateQQ(BOTS, LAST)
  var box = $('qqtable')
  if (!list.length) {
    QQ_SEQ = null; QQ_ROWS = {}
    if (!box.querySelector('.msg')) box.innerHTML = '<span class="msg">没有在线 QQ（或读取失败）</span>'
    return
  }
  var seq = list.map(function (d) { return d.id }).join(',')
  if (seq !== QQ_SEQ) {
    QQ_SEQ = seq; QQ_ROWS = {}
    var h = '<table><thead><tr>'
    for (var i = 0; i < TH.length; i++) {
      h += '<th' + (TH_TIP[i] ? ' title="' + esc(TH_TIP[i]) + '"' : '') + '>' + TH[i] + '</th>'
    }
    h += '</tr></thead><tbody>'
    for (var r = 0; r < list.length; r++) {
      h += '<tr data-id="' + esc(list[r].id) + '">'
      for (var c = 0; c < TH.length; c++) h += '<td></td>'
      h += '</tr>'
    }
    box.innerHTML = h + '</tbody></table>'
    Array.prototype.forEach.call(box.querySelectorAll('tbody tr'), function (tr) { QQ_ROWS[tr.dataset.id] = tr })
    bindQqToggles(); bindRowPush()
  }
  for (var n = 0; n < list.length; n++) {
    var tr = QQ_ROWS[list[n].id]; if (!tr) continue
    var v = qqCells(list[n])
    for (var k = 0; k < KEYS.length; k++) {
      var td = tr.children[k]; if (!td) continue
      var html = v[KEYS[k]]
      if (td.__h !== html) { td.innerHTML = html; td.__h = html }
    }
  }
}

function bindQqToggles() {
  Array.prototype.forEach.call(document.querySelectorAll('[data-qq]'), function (el) {
    el.onchange = function () {
      var id = el.dataset.qq, on = el.checked
      el.disabled = true
      $('botMsg').className = 'msg'
      $('botMsg').textContent = '保存 ' + id + ' …'
      api('/api/qq/enable', { method: 'POST', body: JSON.stringify({ selfId: id, enabled: on }) })
        .then(function (s) {
          BOTMAP[id] = on
          $('botMsg').className = 'msg ok'
          $('botMsg').textContent = id + (on ? ' 已开启自动推送' : ' 已关闭自动推送（仅保留手动推送）')
          paint(s)
        })
        .catch(function (e) {
          el.checked = !on; el.disabled = false
          $('botMsg').className = 'msg bad'
          $('botMsg').textContent = '保存失败：' + e.message
        })
    }
  })
}

function bindRowPush() {
  Array.prototype.forEach.call(document.querySelectorAll('[data-push1]'), function (el) {
    el.onclick = function () { pushOne(el.dataset.push1) }
  })
}

function pushOne(id) {
  PUSHING[id] = true
  $('botMsg').className = 'msg'
  $('botMsg').textContent = '正在推送 ' + id + ' 的 code …'
  paintQQ(BOTS, LAST)
  api('/api/push', { method: 'POST', body: JSON.stringify({ selfId: id, force: true }) })
    .then(function (r) {
      var it = (r.lastRaw && r.lastRaw.items && r.lastRaw.items[0]) || null
      var ok = it && (it.action === 'update' || it.action === 'create')
      $('botMsg').className = 'msg ' + (ok ? 'ok' : 'bad')
      $('botMsg').textContent = ok
        ? (id + ' 推送成功：' + (it.detail || ''))
        : (id + ' 未推送：' + ((it && (it.error || it.detail)) || (r.last && r.last.error) || '未知原因'))
      return reload()
    })
    .catch(function (e) {
      $('botMsg').className = 'msg bad'
      $('botMsg').textContent = '推送失败：' + e.message
    })
    .then(function () { delete PUSHING[id]; paintQQ(BOTS, LAST) })
}

function paint(s) {
  setConn(s.connected ? '已连接框架' : '框架未就绪', s.connected ? 'ok' : 'bad')
  $('ver').textContent = 'v' + s.version
  if (!editBlocked()) {
    FARMS = (s.farms || []).map(function (f) { return { baseUrl: f.baseUrl, username: f.username, label: f.label, passwordSet: f.passwordSet } })
    ACTIVE = s.activeFarm || 0
    renderFarms(); paintOptions(s.options)
  }
  paintQQ(s.bots, s.last || null)
  $('logs').textContent = (s.logs || []).join('\n')
}

function reload() { return api('/api/state').then(paint).catch(function (e) { setConn('读取失败：' + e.message, 'bad') }) }

// ---- 白天 / 夜间切换 ----
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t)
  try { localStorage.setItem('qf-theme', t) } catch (e) {}
  var b = $('theme')
  var t2 = t === 'light' ? '切换到夜间模式' : '切换到白天模式'
  if (b) { b.title = t2; b.setAttribute('aria-label', t2) }
}
$('theme').onclick = function () {
  applyTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light')
}
applyTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark')

$('add').onclick = function () { FARMS.push({ baseUrl: 'http://', username: 'admin', password: '' }); ACTIVE = FARMS.length - 1; renderFarms() }
$('save').onclick = function () {
  var body = { activeFarm: ACTIVE, farms: FARMS.map(function (f) { return { baseUrl: f.baseUrl, username: f.username, password: f.password || '' } }) }
  api('/api/farms', { method: 'POST', body: JSON.stringify(body) })
    .then(function (s) { DIRTY = false; paint(s); $('saveMsg').className = 'msg ok'; $('saveMsg').textContent = '已保存' })
    .catch(function (e) { $('saveMsg').className = 'msg bad'; $('saveMsg').textContent = '保存失败：' + e.message })
}
$('test').onclick = function () {
  $('saveMsg').className = 'msg'; $('saveMsg').textContent = '测试中…'
  api('/api/test', { method: 'POST', body: '{}' })
    .then(function (r) { $('saveMsg').className = 'msg ' + (r.results.every(function (x) { return x.ok }) ? 'ok' : 'bad'); $('saveMsg').textContent = r.results.map(function (x) { return (x.baseUrl || '') + ' → ' + (x.ok ? ('OK，' + x.accounts + ' 个账号（' + (x.mode || '') + '）') : ('失败：' + x.error)) }).join('；') })
    .catch(function (e) { $('saveMsg').className = 'msg bad'; $('saveMsg').textContent = '测试失败：' + e.message })
}
$('saveOpts').onclick = function () {
  var body = {
    intervalMinutes: +$('interval').value, refreshBeforeExpireMin: +$('refresh').value, qqFilter: $('filter').value,
    skipWhenOnline: $('skipOnline').checked, startAfterUpdate: $('startAfter').checked, useEvents: $('useEvents').checked,
    pushAndroid: $('pushAndroid').checked, pushLinux: $('pushLinux').checked
  }
  api('/api/options', { method: 'POST', body: JSON.stringify(body) })

    .catch(function (e) { $('optMsg').className = 'msg bad'; $('optMsg').textContent = '保存失败：' + e.message })
}
$('push').onclick = function () {
  $('optMsg').className = 'msg'; $('optMsg').textContent = '推送中…'
  api('/api/push', { method: 'POST', body: '{}' })
    .then(function () { $('optMsg').className = 'msg ok'; $('optMsg').textContent = '完成'; return reload() })
    .catch(function (e) { $('optMsg').className = 'msg bad'; $('optMsg').textContent = '推送失败：' + e.message })
}

;['interval', 'refresh', 'filter'].forEach(function (id) { $(id).addEventListener('input', function () { DIRTY = true }) })
;['skipOnline', 'startAfter', 'useEvents', 'pushAndroid', 'pushLinux'].forEach(function (id) { $(id).addEventListener('change', function () { DIRTY = true }) })

reload(); setInterval(reload, 5000)
